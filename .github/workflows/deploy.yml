name: deploy

# Deploys the Worker to the Open Practice Cloudflare account.
# Manual only: the owner keeps a tight Actions budget, and a site that redeploys on every commit
# spends minutes nobody asked for. Dispatch this when a change should go live.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and build without deploying"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: tests
        run: node --test test/*.test.mjs
      - name: deploy
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config adapters/cloudflare/wrangler.jsonc
      - name: smoke test
        if: ${{ !inputs.dry_run }}
        run: |
          set -e
          base="https://open-practice.open-practice.workers.dev"
          for path in / /activities.html /curriculum.html /brand/og-1200x630.png /brand/site.webmanifest; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$base$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
          curl -s --max-time 30 "$base/" | grep -q 'og:image' || { echo "::error::no og:image served"; exit 1; }
          echo "smoke test passed"
