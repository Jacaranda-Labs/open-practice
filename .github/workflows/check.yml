name: Check platform
on:
  # 2026-11-01 Actions budget (owner: no business above 10-15 GitHub minutes a day): main only (a
  # branch push plus its pull request used to run this twice), and a docs-only push runs nothing.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:assets
      - run: git diff --exit-code
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r curriculum/expansion/requirements-test.txt
      - run: python scripts/check-expansion.py
